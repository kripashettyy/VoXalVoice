services:
  - type: web
    name: VoXalVoice-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"
      - key: ENGINE_SELECTION
        value: edge-tts
      - key: DEFAULT_PITCH
        value: "1.0"
      - key: DEFAULT_SPEED
        value: "1.0"
      - key: DEFAULT_VOLUME
        value: "0.8"
    healthCheckPath: /api/v1/health
